version: "3.9"

services:
  backend:
    build:
      context: ../backend        # folder containing main.py, requirements.txt
      dockerfile: ../infra/Dockerfile   # adjust path relative to context
    container_name: docuchat-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/backend  
    security_opt:
      - apparmor:unconfined     # optional, for live reload in dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    container_name: docuchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docuchat
      POSTGRES_PASSWORD: docuchat_local_pw
      POSTGRES_DB: docuchat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - apparmor:unconfined
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuchat -d docuchat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docuchat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    security_opt:
      - apparmor:unconfined 
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: docuchat-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    security_opt:
      - apparmor:unconfined
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  qdrant_data: